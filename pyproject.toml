[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collage-recreate"
version = "0.1.0"
description = "Static editable collage tools for OpenClaw"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0", "pydantic==2.13.4", "httpx==0.28.1", "filelock==3.29.4", "fonttools==4.63.0"]

[project.optional-dependencies]
localization = ["numpy==2.5.3", "opencv-python-headless==4.14.0.94"]
test = ["pytest==9.0.3"]

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["collage_recreate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
