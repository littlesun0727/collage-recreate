<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="从参考原图到可重建的图层数据"><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#222}a:hover rect{stroke:#b00000;stroke-width:3}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#999" stroke-width="1.5"/></marker></defs><rect width="1800" height="1100" fill="white"/><text x="48" y="48" font-size="18" font-weight="700" style="fill:#b00000">COLLAGE / WORKFLOW ATLAS · REVEAL-LAYER-LAB</text><text x="48" y="103" font-size="36" font-weight="700" style="fill:#222">从参考原图到可重建的图层数据</text><text x="48" y="143" font-size="21" font-weight="400" style="fill:#666">对象分析保留原图语义；提取素材决定最终 Alpha、位置和本地合成标注。</text><rect x="48" y="169" width="1704" height="52" rx="12" fill="#fff5f5" stroke="#efcccc"/><text x="68" y="202" font-size="20" font-weight="700" style="fill:#b00000">当前状态：360 提取暂停，使用 --analyze-only。</text><a href="#input" aria-label="展开原图与运行目录"><rect x="48" y="260" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M62 260 H574" stroke="#b00000" stroke-width="3"/><text x="72" y="298" font-size="17" font-weight="700" style="fill:#b00000">01 / PREPARE</text><text x="72" y="339" font-size="27" font-weight="700" style="fill:#222">原图与运行目录</text><text x="72" y="381" font-size="20" font-weight="400" style="fill:#555">EXIF 转正 · 记录尺寸与哈希</text><text x="72" y="413" font-size="20" font-weight="400" style="fill:#555">单图 / 批量 / 导入已有分析</text><text x="72" y="445" font-size="20" font-weight="400" style="fill:#555">输入与配置相同才复用缓存</text></a><a href="#route" aria-label="展开视觉分析与模型路由"><rect x="630" y="260" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M644 260 H1156" stroke="#b00000" stroke-width="3"/><text x="654" y="298" font-size="17" font-weight="700" style="fill:#b00000">02 / ANALYZE</text><text x="654" y="339" font-size="27" font-weight="700" style="fill:#222">视觉分析与模型路由</text><text x="654" y="381" font-size="20" font-weight="400" style="fill:#555">默认 Luna medium 先分析</text><text x="654" y="413" font-size="20" font-weight="400" style="fill:#555">前景 &gt;18 → Sol medium 重分析</text><text x="654" y="445" font-size="20" font-weight="400" style="fill:#555">固定 Qwen / Codex 为替代入口</text></a><a href="#validate" aria-label="展开校验与像素坐标统一"><rect x="1212" y="260" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M1226 260 H1738" stroke="#b00000" stroke-width="3"/><text x="1236" y="298" font-size="17" font-weight="700" style="fill:#b00000">03 / CONTRACT</text><text x="1236" y="339" font-size="27" font-weight="700" style="fill:#222">校验与像素坐标统一</text><text x="1236" y="381" font-size="20" font-weight="400" style="fill:#555">GPT：原图 + 尺寸 → 像素框</text><text x="1236" y="413" font-size="20" font-weight="400" style="fill:#555">Qwen：原图 → 0–1000 → 像素</text><text x="1236" y="445" font-size="20" font-weight="400" style="fill:#555">唯一全画布背景 → layer_0</text></a><a href="#extract" aria-label="展开暂停门与分批提取"><rect x="48" y="575" width="540" height="235" rx="12" fill="#fafafa" stroke="#d6d6d6" stroke-dasharray="7 5"/><path d="M62 575 H574" stroke="#b00000" stroke-width="3"/><text x="72" y="613" font-size="17" font-weight="700" style="fill:#b00000">04 / REVEAL · PAUSED</text><text x="72" y="654" font-size="27" font-weight="700" style="fill:#222">暂停门与分批提取</text><text x="72" y="696" font-size="20" font-weight="400" style="fill:#555">analyze-only 在此之前结束</text><text x="72" y="728" font-size="20" font-weight="400" style="fill:#555">每批 ≤20 前景 · 从顶层向下</text><text x="72" y="760" font-size="20" font-weight="400" style="fill:#555">下一批输入 = 上批 base 背景</text></a><a href="#layers" aria-label="展开收集素材与最终背景"><rect x="630" y="575" width="540" height="235" rx="12" fill="#fafafa" stroke="#d6d6d6" stroke-dasharray="7 5"/><path d="M644 575 H1156" stroke="#b00000" stroke-width="3"/><text x="654" y="613" font-size="17" font-weight="700" style="fill:#b00000">05 / LAYERS</text><text x="654" y="654" font-size="27" font-weight="700" style="fill:#222">收集素材与最终背景</text><text x="654" y="696" font-size="20" font-weight="400" style="fill:#555">检查缺层 / 空 Alpha / 尺寸</text><text x="654" y="728" font-size="20" font-weight="400" style="fill:#555">只保留最后一批背景</text><text x="654" y="760" font-size="20" font-weight="400" style="fill:#555">base 与 aug 来自同一条链</text></a><a href="#render" aria-label="展开本地合成与标注"><rect x="1212" y="575" width="540" height="235" rx="12" fill="#fafafa" stroke="#d6d6d6" stroke-dasharray="7 5"/><path d="M1226 575 H1738" stroke="#b00000" stroke-width="3"/><text x="1236" y="613" font-size="17" font-weight="700" style="fill:#b00000">06 / DATASET</text><text x="1236" y="654" font-size="27" font-weight="700" style="fill:#222">本地合成与标注</text><text x="1236" y="696" font-size="20" font-weight="400" style="fill:#555">按原层序从下到上 Alpha 合成</text><text x="1236" y="728" font-size="20" font-weight="400" style="fill:#555">最终 bbox = 素材非零 Alpha 边界</text><text x="1236" y="760" font-size="20" font-weight="400" style="fill:#555">base / aug 分别配图与标注</text></a><path d="M588 377 H622" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 377 H1204" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M588 692 H622" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 692 H1204" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M1482 495 V530 H26 V692 H40" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><text x="58" y="550" font-size="16" font-weight="400" style="fill:#666">主线继续 →</text><text x="180" y="550" font-size="19" font-weight="400" style="fill:#b00000">--analyze-only 在 03 后结束；04–06 是恢复提取后的路径</text><path d="M900 810 V848 H318 V818" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="480" y="840" font-size="18" font-weight="400" style="fill:#b00000">仍有前景：上一批 base 背景 → 下一批提取</text><rect x="48" y="886" width="820" height="137" rx="12" fill="#fafafa" stroke="#d6d6d6"/><text x="72" y="922" font-size="22" font-weight="700" style="fill:#222">分析路由</text><text x="72" y="959" font-size="20" font-weight="400" style="fill:#222">Luna 前景 ≤18 直接采用；&gt;18 → Sol 独立分析</text><text x="72" y="993" font-size="19" font-weight="400" style="fill:#666">升级失败停止；全画布背景不参与计数</text><rect x="894" y="886" width="858" height="137" rx="12" fill="#fafafa" stroke="#d6d6d6"/><text x="918" y="922" font-size="22" font-weight="700" style="fill:#222">最终产物与验收</text><text x="918" y="959" font-size="20" font-weight="400" style="fill:#222">两套裁片 / reference / 标注 / 图层预览</text><text x="918" y="993" font-size="19" font-weight="400" style="fill:#666">只保留最后背景；complete 仍需视觉验收</text><text x="48" y="1065" font-size="18" font-weight="400" style="fill:#666">实线：主流程　虚线：条件分支 / 暂停后的路径　点击节点查看输入、判断、产物和源码依据</text></svg>