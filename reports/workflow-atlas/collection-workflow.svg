<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-label="从平台原始素材到合格拼贴模板"><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#222}a:hover rect{stroke:#b00000;stroke-width:3}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#999" stroke-width="1.5"/></marker></defs><rect width="1800" height="1100" fill="white"/><text x="48" y="48" font-size="18" font-weight="700" style="fill:#b00000">COLLAGE / WORKFLOW ATLAS · TEMPLATE_DOWNLOAD</text><text x="48" y="103" font-size="36" font-weight="700" style="fill:#222">从平台原始素材到合格拼贴模板</text><text x="48" y="143" font-size="21" font-weight="400" style="fill:#666">采集、初筛、审核独立运行；SQLite 和文件队列连接阶段，支持断点恢复。</text><rect x="48" y="169" width="1704" height="52" rx="12" fill="#fff5f5" stroke="#efcccc"/><text x="68" y="202" font-size="20" font-weight="700" style="fill:#b00000">配置快照：40 个启用关键词 / 42 个暂停词 / 目标 200,000 个原始封面</text><a href="#search" aria-label="展开关键词搜索与详情"><rect x="48" y="260" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M62 260 H574" stroke="#b00000" stroke-width="3"/><text x="72" y="298" font-size="17" font-weight="700" style="fill:#b00000">01 / COLLECT</text><text x="72" y="339" font-size="27" font-weight="700" style="fill:#222">关键词搜索与详情</text><text x="72" y="381" font-size="20" font-weight="400" style="fill:#555">平滑加权轮转 · 按词完成一轮</text><text x="72" y="413" font-size="20" font-weight="400" style="fill:#555">每轮最多 20 页</text><text x="72" y="445" font-size="20" font-weight="400" style="fill:#555">无更多结果 / 连续低新增 → 换词</text></a><a href="#raw" aria-label="展开原始文件落盘"><rect x="630" y="260" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M644 260 H1156" stroke="#b00000" stroke-width="3"/><text x="654" y="298" font-size="17" font-weight="700" style="fill:#b00000">02 / DOWNLOAD</text><text x="654" y="339" font-size="27" font-weight="700" style="fill:#222">原始文件落盘</text><text x="654" y="381" font-size="20" font-weight="400" style="fill:#555">封面下载并发 2 · Live 串行</text><text x="654" y="413" font-size="20" font-weight="400" style="fill:#555">临时文件 → 原子替换 → ready</text><text x="654" y="445" font-size="20" font-weight="400" style="fill:#555">Live 封面 + MP4 成对保留</text></a><a href="#screen" aria-label="展开离线初筛与去重"><rect x="1212" y="260" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M1226 260 H1738" stroke="#b00000" stroke-width="3"/><text x="1236" y="298" font-size="17" font-weight="700" style="fill:#b00000">03 / SCREEN</text><text x="1236" y="339" font-size="27" font-weight="700" style="fill:#222">离线初筛与去重</text><text x="1236" y="381" font-size="20" font-weight="400" style="fill:#555">短边 ≥720 · 像素 ≥800,000</text><text x="1236" y="413" font-size="20" font-weight="400" style="fill:#555">长短边比 ≤3.0 · dHash ≤4</text><text x="1236" y="445" font-size="20" font-weight="400" style="fill:#555">校验文件 / EXIF / Live 配对</text></a><a href="#triage" aria-label="展开VLM 只做分类"><rect x="48" y="575" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M62 575 H574" stroke="#b00000" stroke-width="3"/><text x="72" y="613" font-size="17" font-weight="700" style="fill:#b00000">04 / REVIEW · TRIAGE</text><text x="72" y="654" font-size="27" font-weight="700" style="fill:#222">VLM 只做分类</text><text x="72" y="696" font-size="20" font-weight="400" style="fill:#555">100 张审核批次 · 每请求 20 张</text><text x="72" y="728" font-size="20" font-weight="400" style="fill:#555">缩略输入最长边 768 · low</text><text x="72" y="760" font-size="20" font-weight="400" style="fill:#555">single / collection / other / unsure</text></a><a href="#locate" aria-label="展开按需定位完整画布"><rect x="630" y="575" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M644 575 H1156" stroke="#b00000" stroke-width="3"/><text x="654" y="613" font-size="17" font-weight="700" style="fill:#b00000">05 / REVIEW · LOCATE</text><text x="654" y="654" font-size="27" font-weight="700" style="fill:#222">按需定位完整画布</text><text x="654" y="696" font-size="20" font-weight="400" style="fill:#555">只处理 single + needs_crop</text><text x="654" y="728" font-size="20" font-weight="400" style="fill:#555">原分辨率 · 每请求最多 5 张</text><text x="654" y="760" font-size="20" font-weight="400" style="fill:#555">crop / keep / review · 0–1000 框</text></a><a href="#export" aria-label="展开裁剪复核与导出"><rect x="1212" y="575" width="540" height="235" rx="12" fill="#fff" stroke="#d6d6d6"/><path d="M1226 575 H1738" stroke="#b00000" stroke-width="3"/><text x="1236" y="613" font-size="17" font-weight="700" style="fill:#b00000">06 / PUBLISH</text><text x="1236" y="654" font-size="27" font-weight="700" style="fill:#222">裁剪复核与导出</text><text x="1236" y="696" font-size="20" font-weight="400" style="fill:#555">原图保留 · 裁片另存 PNG</text><text x="1236" y="728" font-size="20" font-weight="400" style="fill:#555">最终像素哈希 / dHash 再去重</text><text x="1236" y="760" font-size="20" font-weight="400" style="fill:#555">accept → accepted.jsonl + 图库</text></a><path d="M588 377 H622" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 377 H1204" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M588 692 H622" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M1170 692 H1204" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><path d="M1482 495 V530 H26 V692 H40" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/><text x="58" y="550" font-size="16" font-weight="400" style="fill:#666">主线继续 →</text><path d="M318 810 V848 H1482 V818" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="554" y="840" font-size="18" font-weight="400" style="fill:#b00000">single 且无需裁剪：跳过定位，进入最终处理</text><rect x="48" y="886" width="820" height="137" rx="12" fill="#fafafa" stroke="#d6d6d6"/><text x="72" y="922" font-size="22" font-weight="700" style="fill:#222">分类出口</text><text x="72" y="959" font-size="20" font-weight="400" style="fill:#222">collection / other → reject；unsure → 人工复核</text><text x="72" y="993" font-size="19" font-weight="400" style="fill:#666">需裁剪但定位缺失 → pending，补跑缺失请求</text><rect x="894" y="886" width="858" height="137" rx="12" fill="#fafafa" stroke="#d6d6d6"/><text x="918" y="922" font-size="22" font-weight="700" style="fill:#222">恢复与持久化</text><text x="918" y="959" font-size="20" font-weight="400" style="fill:#222">SQLite 游标 + 成功调用缓存 + 独立阶段锁</text><text x="918" y="993" font-size="19" font-weight="400" style="fill:#666">访问验证 / 重试耗尽 → 保存断点并提醒</text><text x="48" y="1065" font-size="18" font-weight="400" style="fill:#666">实线：主流程　虚线：条件分支 / 暂停后的路径　点击节点查看输入、判断、产物和源码依据</text></svg>