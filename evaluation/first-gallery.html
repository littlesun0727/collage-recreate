<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合并规则 · 客户素材首版</title>
<style>__COMMON_CSS__</style>
<header><div class="eyebrow">COLLAGE / FIRST RENDER</div><h1 id="heading">首版制作结果</h1><p>左侧参考 · 右侧冻结首版 · 每张参考独立 SDK 会话</p><p id="updated"></p></header>
<div class="wrap"><div id="stats" class="stats"></div><p class="notice">客户素材：人像素材3.0（5张）＋风景照片（14张）。本轮只做本地首版，不生图、不多轮精修。保留占位、提取失败和视觉缺陷，右侧始终使用首次成图；客户人物与参考人物不同是正常替换。</p><div class="tools"><input id="search" type="search" placeholder="搜索参考图名称" aria-label="搜索参考图"><select id="filter" aria-label="筛选结果"><option value="all">全部16张</option><option value="ready">已有首版</option><option value="issues">复核需要修改</option><option value="pending">尚未完成</option><option value="pass">模型判定通过</option></select><select id="display" aria-label="显示布局"><option value="both">参考与首版并排</option><option value="after">仅看首版</option><option value="baseline">上一轮 / 本轮首版</option></select><button id="refresh">刷新进度</button></div><p id="count"></p><main id="cards"></main><p class="foot">模型结论来自每张图的独立制作会话。素材来源检查不代替视觉验收；两轮均独立分析和选图，绑定可能不同；本轮允许首版细微风格差异，复核口径也有调整。耗时与对象数仅作描述性对照，通过数量不能直接当成准确率提升。</p></div>
<dialog id="viewer"><div class="viewerbar"><strong id="viewtitle"></strong><button id="minus" aria-label="缩小">−</button><span id="percent"></span><button id="plus" aria-label="放大">＋</button><button id="fit">适应窗口</button><button id="close">关闭</button></div><div id="stage" class="stage"><img id="zoomimg" alt="放大查看"></div></dialog>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sec=x=>x==null?'待完成':Math.floor(Math.round(x)/60)+'分'+String(Math.round(x)%60).padStart(2,'0')+'秒';
function verdict(c){if(c.visual_verdict==='pass'&&c.review_registered)return ['pass','模型复核通过'];if(c.visual_verdict==='needs_changes')return ['warn','首版仍需修改'];if(['failed','timed_out','incomplete','stopped','harness_failed'].includes(c.status)||c.visual_verdict==='blocked')return ['major','执行未完成'];if(c.first_url)return ['pending','已出首版 · 复核中'];return ['pending',c.status==='queued'?'等待运行':'制作中'];}
const pill=c=>{const [k,t]=verdict(c);return `<span class="pill ${k}">${t}</span>`;};
$('updated').textContent=data.model+' / '+data.effort+' · 更新于 '+new Date(data.generated_at).toLocaleString('zh-CN');
$('heading').textContent=data.title||'首版制作结果';document.title=data.title||'首版制作结果';
const issues=data.items.filter(c=>c.visual_verdict==='needs_changes').length;
$('stats').innerHTML=[['首次成图',data.rendered+' / '+data.items.length,'真实客户素材，本地制作'],['会话已完成',data.completed+' / '+data.items.length,'每张参考单独执行'],['首版耗时中位数',sec(data.first_median),'从会话启动至首次 build 完成'],['已报告需修改',issues+' 张','未完成不计为通过']].map(([t,v,n])=>`<div class="stat"><small>${esc(t)}</small><strong>${esc(v)}</strong><small>${esc(n)}</small></div>`).join('');
function img(src,title){return src?`<img class="preview" loading="lazy" src="${esc(src)}" alt="${esc(title)}">`:'<div class="empty">首版尚未生成</div>';}
function links(c){let rows=[['上一轮首版',c.previous_first_url],['分析叠框',c.boxes_url],['完整对照图',c.comparison_url],['analysis.json',c.analysis_url],['bindings.json',c.bindings_url],['review.json',c.review_url],...c.extraction_urls.map((u,i)=>['提取联系表 '+(i+1),u])];return rows.filter(x=>x[1]).map(([t,u])=>`<a href="${esc(u)}" target="_blank">${esc(t)}</a>`).join('');}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;let n=0;$('cards').classList.toggle('afteronly',$('display').value==='after');$('cards').innerHTML=data.items.map(c=>{if(!c.name.toLowerCase().includes(q)||f==='ready'&&!c.first_url||f==='issues'&&c.visual_verdict!=='needs_changes'||f==='pending'&&c.status==='completed'||f==='pass'&&(c.visual_verdict!=='pass'||!c.review_registered))return '';n++;const texts=(c.issues||[]).map(x=>`<div class="issue">${esc(typeof x==='string'?x:JSON.stringify(x))}</div>`).join('');const kinds=c.object_counts_by_kind||{};return `<article><div class="cardhead"><h2>${esc(c.name)}</h2>${pill(c)}</div><div class="pair"><section class="side before"><div class="sidetop"><strong>${$('display').value==='baseline'?'上一轮首版':'参考图'}</strong><span class="muted">${(c.analysis_size||[]).join(' × ')}</span></div><div class="imagebox">${img($('display').value==='baseline'?c.previous_first_url:c.reference_url,c.name+($('display').value==='baseline'?' 上一轮首版':' 参考图'))}</div></section><section class="side after"><div class="sidetop"><strong>冻结首版</strong><span class="muted">${sec(c.first_preview_seconds)}</span></div><div class="imagebox">${img(c.first_url,c.name+' 冻结首版')}</div></section></div><div class="side"><div class="meta">本轮对象 ${c.object_count??'待分析'}（照片 ${kinds.photo??'—'} / 文字 ${kinds.text??'—'} / 装饰 ${kinds.overlay??'—'}） · ${esc(data.baseline_label)} ${c.baseline_objects??'—'}<br>客户照片来源检查：${c.first_url?(c.customer_photos_verified?'已核验':'尚未通过'):'待制作'} · 提取完成 ${c.extraction_successes??0} / 失败 ${c.extraction_failures??0}（完成不表示视觉合格） · 会话总耗时 ${sec(c.total_seconds)}${c.previous_first_seconds!=null?'<br>上一轮首版 '+sec(c.previous_first_seconds)+' → 本轮首版 '+sec(c.first_preview_seconds):''}</div><div class="links">${links(c)}</div>${texts?`<details open><summary>制作模型报告的问题</summary>${texts}</details>`:''}${c.session_error?`<div class="issue">${esc(c.session_error)}</div>`:''}${(c.friction||[]).length?`<details><summary>执行中的操作障碍</summary>${c.friction.map(x=>`<div class="issue">${esc(typeof x==='string'?x:JSON.stringify(x))}</div>`).join('')}</details>`:''}${c.first_matches_final===false?'<div class="issue">当前导出与冻结首版不同；页面展示冻结首版。</div>':''}</div></article>`;}).join('');$('count').textContent='显示 '+n+' / '+data.items.length+' 张 · 点图片可放大查看';}
for(const id of ['search','filter','display'])$(id).addEventListener('input',render);$('refresh').onclick=()=>location.reload();
let zoom=1;function applyZoom(){const im=$('zoomimg');im.style.width=Math.max(100,im.naturalWidth*zoom)+'px';$('percent').textContent=Math.round(zoom*100)+'%';}function fit(){zoom=Math.min(1,($('stage').clientWidth-32)/$('zoomimg').naturalWidth,($('stage').clientHeight-32)/$('zoomimg').naturalHeight);applyZoom();}
$('cards').onclick=e=>{const im=e.target.closest('img.preview');if(!im)return;$('viewtitle').textContent=im.alt;$('zoomimg').onload=fit;$('viewer').showModal();$('zoomimg').src=im.src;if($('zoomimg').complete&&$('zoomimg').naturalWidth)fit();};$('plus').onclick=()=>{zoom=Math.min(5,zoom*1.3);applyZoom();};$('minus').onclick=()=>{zoom=Math.max(.1,zoom/1.3);applyZoom();};$('fit').onclick=fit;$('close').onclick=()=>$('viewer').close();render();
</script></html>
