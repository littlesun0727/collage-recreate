<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼贴分析 · 修复前后对照</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#17243a;background:#edf1f6;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{background:#14253e;color:#fff;padding:32px max(24px,calc((100vw - 1400px)/2))}h1{font-size:28px;margin:6px 0 12px}header p{color:#c4d0e1;margin:7px 0;font-size:14px}.eyebrow{font-size:12px;letter-spacing:2px;color:#82bfff}.wrap{max-width:1448px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:white;padding:18px 20px;border-radius:12px;border:1px solid #dce3ed}.stat strong{display:block;font-size:27px;margin:5px 0}.muted,.stat small{color:#60718b;font-size:13px}.tools{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#edf1f6ee;padding:12px 0;backdrop-filter:blur(10px)}input,select,button{font:inherit;font-size:14px;border:1px solid #c9d4e4;border-radius:8px;padding:10px 12px;background:white;color:#17243a}button{cursor:pointer}button:hover{border-color:#3177cc;background:#f3f8ff}input{flex:1;min-width:160px}a{color:#195fab}article{background:white;border:1px solid #dce3ed;border-radius:14px;margin:20px 0;overflow:hidden}.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 22px;border-bottom:1px solid #e4e9f1}h2{font-size:18px;margin:0;word-break:break-all}.pill{font-size:12px;border-radius:30px;padding:6px 10px;display:inline-block;white-space:nowrap;background:#eef2f8;color:#536580}.pass{background:#e4f4ed;color:#256448}.warn{background:#fff1d9;color:#85550c}.major{background:#fce6e7;color:#9b333c}.pair{display:grid;grid-template-columns:1fr 1fr}.side{min-width:0;padding:18px}.side+.side{border-left:1px solid #e4e9f1}.sidetop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sidetop strong{font-size:15px}.imagebox{background:#f1f3f7;min-height:160px;display:flex;justify-content:center;align-items:center;border-radius:8px;overflow:hidden}.preview{width:100%;height:660px;object-fit:contain;cursor:zoom-in}.empty{padding:65px 20px;color:#78869c;text-align:center}.meta{font-size:12px;color:#60718b;margin:10px 0;line-height:1.9}.links{display:flex;gap:14px;font-size:12px;flex-wrap:wrap}details{margin-top:14px;border-top:1px solid #e7ecf3;padding-top:12px}summary{cursor:pointer;font-size:14px;font-weight:600}.issue{padding:11px 12px;background:#f7f9fc;border-radius:7px;margin:9px 0;font-size:13px;line-height:1.7}.issue code{overflow-wrap:anywhere}.issue p{margin:5px 0}.pattern{font-size:13px;line-height:1.8;color:#4b5e79}.afteronly .side.before{display:none}.afteronly .pair{grid-template-columns:1fr}.afteronly .side+.side{border-left:0}.afteronly .preview{height:820px}#count{font-size:13px;color:#60718b;margin:8px 0}.notice{font-size:13px;line-height:1.8;color:#596b83}dialog{border:0;border-radius:12px;width:94vw;height:92vh;max-width:none;max-height:none;padding:0;background:#e8edf4}dialog::backdrop{background:#09172dcc}.viewerbar{height:62px;padding:10px 16px;display:flex;gap:10px;align-items:center;background:white}.viewerbar strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.stage{height:calc(100% - 62px);overflow:auto;text-align:center;padding:16px}#zoomimg{max-width:none;display:block;margin:auto}.foot{font-size:12px;color:#60718b;text-align:center;padding:20px}@media(max-width:760px){.wrap{padding:14px}.stats{grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}.side+.side{border-left:0;border-top:1px solid #e4e9f1}.preview{height:auto;max-height:780px}.cardhead{padding:14px}h1{font-size:23px}.viewerbar{gap:5px}.viewerbar button{padding:8px}.stat strong{font-size:23px}}
</style>
<header><div class="eyebrow">COLLAGE / ANALYSIS CHECK</div><h1>修复前后，逐张看框</h1><p>Codex Agent SDK · gpt-5.6-sol · medium · 冻结首次分析</p><p id="updated"></p></header>
<div class="wrap"><div class="stats" id="stats"></div><p class="notice">左侧为上一轮原尺寸基线，右侧为修复传图后的首次结果。复核结论由指定模型生成，不能当作人工准确率或成品验收；对象拆分可能不同。点击图片放大查看。</p><div class="tools"><input id="search" type="search" placeholder="搜索图片名称" aria-label="搜索图片名称"><select id="filter" aria-label="筛选修复后结论"><option value="all">全部图片</option><option value="issues">复核有问题</option><option value="major">含重大问题</option><option value="pass">复核未提出修改</option><option value="pending">尚未完成</option></select><select id="display" aria-label="对照布局"><option value="both">前后并排</option><option value="after">仅看修复后</option></select><button id="raw">切换到无框参考图</button><button id="refresh">刷新报告</button></div><p id="count"></p><main id="cards"></main><div class="foot">本地报告，无需联网。快照更新后刷新此页面即可；待完成不表示通过。</div></div>
<dialog id="viewer"><div class="viewerbar"><strong id="viewtitle"></strong><button id="minus" aria-label="缩小">−</button><span id="percent"></span><button id="plus" aria-label="放大">＋</button><button id="fit">适应窗口</button><button id="close">关闭</button></div><div class="stage" id="stage"><img id="zoomimg" alt="放大后的分析图"></div></dialog>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const done=c=>c&&c.critic_status==='completed';
const size=x=>x?x.join(' × '):'待核查';
const seconds=x=>x==null?'待完成':Math.floor(x/60)+'分'+String(Math.round(x%60)).padStart(2,'0')+'秒';
function status(c){if(!done(c))return ['pending',c?.analyst_status==='completed'?'待独立复核':c?'分析进行中':'待运行'];if(c.major_count)return ['major',c.major_count+' 项重大问题'];if(c.critic_verdict==='needs_changes')return ['warn','有局部问题'];return ['pass','复核未提出修改'];}
const pill=c=>{const [cl,txt]=status(c);return `<span class="pill ${cl}">${txt}</span>`;};
const total=data.pairs.length,b=data.before,a=data.after;
$('updated').textContent='快照更新：'+new Date(data.generated_at).toLocaleString('zh-CN')+' · 分析完成 '+a.analysts_completed+'/'+total+' · 独立复核 '+a.critics_completed+'/'+total;
$('stats').innerHTML=[['本轮复核进度',a.critics_completed+' / '+total,'完成分析 '+a.analysts_completed+' 张'],['含重大问题的图片',b.images_with_major+' → '+a.images_with_major,'修复前 → 修复后；后者仅统计已完成'],['复核未提出修改',b.critic_pass+' → '+a.critic_pass,'修复前 → 修复后；不是成品通过数'],['本轮分析中位耗时',seconds(a.analyst_seconds_median),'包含写 JSON、冻结与自检']].map(([title,value,note])=>`<div class="stat"><small>${esc(title)}</small><strong>${esc(value)}</strong><small>${esc(note)}</small></div>`).join('');
let raw=false;
function selfcheck(c){const issues=c.self_issues||[];if(!issues.length)return '';return '<details><summary>分析者自检：'+issues.length+' 项观察（范围也包含层级和漏项）</summary>'+issues.map(e=>'<div class="issue"><code>'+esc(e.id||'整体')+'</code><p>'+esc(e.reason||e)+'</p></div>').join('')+'</details>';}

function side(c,label,cls,index){if(!c)return `<section class="side ${cls}"><div class="sidetop"><strong>${label}</strong>${pill(c)}</div><div class="empty">这张图尚未开始运行</div></section>`;
const src=raw?c.reference_url:c.boxes_url;
const issueRows=c.errors.map(e=>`<div class="issue"><span class="pill ${e.severity==='major'?'major':'warn'}">${e.severity==='major'?'重大':'轻微'}</span> <code>${esc(e.id)}</code><p>${esc(e.reason)}</p><span class="muted">原框 ${esc(JSON.stringify(e.observed_bbox))} · 复核置信度 ${esc(e.confidence)}</span></div>`).join('');
return `<section class="side ${cls}"><div class="sidetop"><strong>${label} · ${c.object_count||'待定'} 个对象</strong>${pill(c)}</div><div class="imagebox">${src?`<img class="preview" loading="lazy" src="${esc(src)}" alt="${esc(data.pairs[index].name+' '+label)}" data-index="${index}" data-side="${cls}">`:'<div class="empty">首次分析尚未冻结</div>'}</div><div class="meta">画布 ${size(c.analysis_size)} · 实际首张输入 ${size(c.actual_first_visual_size)}<br>分析 ${seconds(c.analyst_seconds)} · 独立复核 ${seconds(c.critic_seconds)} · 分析者自检 ${esc(c.self_verdict||'待完成')}</div><div class="links">${c.analysis_url?`<a href="${esc(c.analysis_url)}" target="_blank">首次 JSON</a>`:''}${c.review_url?`<a href="${esc(c.review_url)}" target="_blank">独立复核 JSON</a>`:''}${c.boxes_url?`<a href="${esc(c.boxes_url)}" target="_blank">打开完整叠框图</a>`:''}</div>${selfcheck(c)}${done(c)?`<details ${c.errors.length?'open':''}><summary>${c.errors.length?'查看 '+c.errors.length+' 项定位问题':'查看复核说明'}</summary><p class="pattern">${esc(c.pattern)}</p>${issueRows}</details>`:'<p class="pattern">复核尚未完成，当前图片仅用于查看进度。</p>'}</section>`;}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;let n=0;$('cards').classList.toggle('afteronly',$('display').value==='after');$('cards').innerHTML=data.pairs.map((p,i)=>{const c=p.after;if(!p.name.toLowerCase().includes(q))return '';if(f==='issues'&&(!done(c)||c.critic_verdict!=='needs_changes'))return '';if(f==='major'&&(!done(c)||!c.major_count))return '';if(f==='pass'&&(!done(c)||c.critic_verdict!=='pass'))return '';if(f==='pending'&&done(c))return '';n++;return `<article><div class="cardhead"><h2>${esc(p.name)}</h2>${pill(c)}</div><div class="pair">${side(p.before,'修复前','before',i)}${side(c,'修复后','after',i)}</div></article>`;}).join('');$('count').textContent='显示 '+n+' / '+total+' 张 · 照片绿框 / 文字红框 / 装饰蓝框';}
for(const id of ['search','filter','display'])$(id).addEventListener('input',render);
$('raw').onclick=()=>{raw=!raw;$('raw').textContent=raw?'切换到叠框图':'切换到无框参考图';render();};$('refresh').onclick=()=>location.reload();
let zoom=1;function applyZoom(){const im=$('zoomimg');im.style.width=Math.max(100,im.naturalWidth*zoom)+'px';$('percent').textContent=Math.round(zoom*100)+'%';}
function fit(){zoom=Math.min(1,($('stage').clientWidth-32)/$('zoomimg').naturalWidth,($('stage').clientHeight-32)/$('zoomimg').naturalHeight);applyZoom();}
$('cards').onclick=e=>{const im=e.target.closest('img.preview');if(!im)return;$('viewtitle').textContent=im.alt;$('zoomimg').onload=fit;$('viewer').showModal();$('zoomimg').src=im.src;if($('zoomimg').complete&&$('zoomimg').naturalWidth)fit();};
$('plus').onclick=()=>{zoom=Math.min(5,zoom*1.3);applyZoom();};$('minus').onclick=()=>{zoom=Math.max(.1,zoom/1.3);applyZoom();};$('fit').onclick=fit;$('close').onclick=()=>$('viewer').close();
render();
</script>
</html>
