<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v5 解析：内容归属与完整单元</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#243041;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:20px}h1{font-size:26px;margin:0}h2{font-size:20px;margin:0 0 10px}p{margin:9px 0}a{color:#1668b2}button,select,input{font:inherit}button,select{padding:7px 12px;border:1px solid #c8d2df;border-radius:6px;background:white;cursor:pointer}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#eef1f5f5;padding:12px 0;z-index:3}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.card{background:white;border-radius:10px;padding:16px;margin-bottom:16px}.canvas{position:relative;width:100%;background:#ddd;line-height:0}.canvas img{width:100%;display:block}.canvas svg{position:absolute;inset:0;width:100%;height:100%}.box{fill:transparent;cursor:pointer;vector-effect:non-scaling-stroke;stroke-width:1.5}.box.selected{stroke-width:4;fill:#ffff0030}.label{font-family:Arial,sans-serif;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.list{max-height:360px;overflow:auto;border-top:1px solid #ddd;margin-top:12px}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;border-radius:0;padding:7px;background:white}.item.active{background:#e5efff}.detail{min-height:110px;padding:10px;background:#f6f8fb;margin-top:10px;overflow-wrap:anywhere}.muted{color:#657387}.tag{padding:2px 7px;border-radius:4px;background:#eef3f8;font-size:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #dce3eb;padding:7px}tr[data-index]{cursor:pointer}tr[data-index]:hover{background:#e5efff}.summary-table{max-height:330px;overflow:auto}.issues li{margin:6px 0}.links{display:flex;gap:12px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}svg.hide-labels text{display:none}@media(max-width:780px){.panels{grid-template-columns:1fr}header,main{padding:12px}}
</style></head><body><header><h1>v5 解析：内容归属与完整单元</h1><p>旧版与本次新分析并排；点击图框或元素列表，查看完整范围与归属。两边都叠在参考图上，均不是重建成品。</p><p class="muted">Codex Agent SDK · gpt-5.6-sol / medium · 仅解析，无360调用与回填。对象变少不等于没有漏项；右侧自检来自同一分析模型。</p><div id="stats"></div><p class="links"><a href="INSPECTION_NOTES.md" target="_blank">本轮检查与已知问题</a><a href="REPORT.md" target="_blank">报告</a><a href="summary.json" target="_blank">完整数据</a><a href="verification.json" target="_blank">运行核验</a></p></header><main><div class="toolbar"><button id="prev">上一张</button><select id="cases"></select><button id="next">下一张</button><select id="kind"><option value="all">全部类型</option><option value="photo">客户照片</option><option value="overlay">固定装饰</option><option value="text">文字</option><option value="background">背景</option></select><label><input id="labels" type="checkbox" checked>显示ID</label><label><input id="only" type="checkbox">仅显示选中框</label><button id="clear">清除选择</button></div><div id="panels" class="panels"></div><section id="review" class="card"></section><details class="card"><summary>16图数量对照（点击切换）</summary><div id="table" class="summary-table"></div></details></main>
<script id="payload" type="application/json">__PAYLOAD__</script><script>
const data=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={photo:'#08a34b',overlay:'#087df3',text:'#ef3f42',background:'#9473bb'},names={photo:'照片',overlay:'装饰',text:'文字',background:'背景'};let current=0,selected={old:null,new:null};
const link=(url,label)=>url?`<a href="${esc(url)}" target="_blank">${esc(label)}</a>`:'';
$('stats').textContent=`已冻结 ${data.frozen}/${data.total} · 会话完成 ${data.completed}/${data.total} · 成对对象数 ${data.paired_objects.old} → ${data.paired_objects.new} · JSON冻结中位数 ${data.freeze_median_seconds??'—'} 秒`;
$('cases').innerHTML=data.cases.map((c,i)=>`<option value="${i}">${esc(c.name)}${c.new?'':'（待完成）'}</option>`).join('');
function panel(side,title){const c=data.cases[current],s=c[side];if(!s)return `<section class="panel"><h2>${title}</h2><p>尚未冻结分析；刷新页面查看后续结果。</p></section>`;
 const [w,h]=s.analysis.reference_size,objects=s.analysis.objects,filter=$('kind').value,chosen=selected[side],shown=objects.filter(o=>(filter==='all'||o.kind===filter)&&(!$('only').checked||!chosen||o.id===chosen));
 const shapes=shown.map(o=>{const [l,t,r,b]=o.bbox,color=colors[o.kind];return `<g data-id="${esc(o.id)}"><rect class="box ${o.id===chosen?'selected':''}" x="${l}" y="${t}" width="${r-l}" height="${b-t}" stroke="${color}"><title>${esc(o.label)} · ${esc(o.id)}</title></rect><text class="label" x="${l+3}" y="${Math.min(h-4,t+Math.max(14,w/65))}" font-size="${Math.max(12,w/70)}" fill="${color}">${esc(o.id)}</text></g>`}).join('');
 const o=objects.find(x=>x.id===chosen),detail=o?`<b>${esc(o.label)}</b> <span class="tag">${esc(o.id)}</span><p>${esc(o.description)}</p><div>bbox ${esc(JSON.stringify(o.bbox))} · 层序 ${s.analysis.layer_order.indexOf(o.id)+1}/${objects.length}</div><div>${esc(['method','mode','appearance','parent_id','photo_id','embedded_in','window_bbox','rotation'].filter(k=>o[k]!==undefined).map(k=>k+'='+JSON.stringify(o[k])).join(' · '))}</div>${o.kind==='text'?'<p>文字：'+esc(o.text??'不可辨')+'</p>':''}`:'点击一个元素，单独检查它的框、描述和关系。';
 return `<section class="panel" data-side="${side}"><h2>${title} · ${s.objects} 个对象</h2><p>${Object.entries(s.counts).map(([k,v])=>`${names[k]} ${v}`).join(' · ')}</p><p class="links">${link(s.json_url,'analysis.json')}${link(s.bindings_url,'bindings.json')}${link(s.boxes_url,'框选PNG')}</p><div class="canvas"><img alt="${esc(title)}的原始参考图" src="${esc(s.reference_url)}"><svg class="${$('labels').checked?'':'hide-labels'}" viewBox="0 0 ${w} ${h}">${shapes}</svg></div><div class="detail">${detail}</div><div class="list">${objects.filter(o=>filter==='all'||o.kind===filter).map(o=>`<button class="item ${o.id===chosen?'active':''}" data-id="${esc(o.id)}"><span style="color:${colors[o.kind]}">●</span> ${esc(o.label)} <span class="muted">${esc(o.id)}</span></button>`).join('')}</div></section>`;
}
function render(){const c=data.cases[current];$('cases').value=current;$('panels').innerHTML=panel('old','旧分析')+panel('new','新分析');const r=c.review;
 const photoChange=c.old&&c.new&&(c.old.counts.photo??0)!==(c.new.counts.photo??0)?`<p style="background:#fff3d4;padding:10px">照片槽数量 ${c.old.counts.photo??0} → ${c.new.counts.photo??0}。请结合图与描述检查：这是背景归类/照片内部内容归属变化，还是漏掉了独立替换窗口。</p>`:'';
 $('review').innerHTML=`<h2>新分析自检 · ${esc(r.verdict??c.state)}</h2>${photoChange}<p>${esc(r.summary??'尚未完成。')}</p><p>${link(c.review_url,'自检JSON')} · JSON冻结 ${c.freeze_seconds??'—'} 秒 · 含自检全程 ${c.session_seconds??'—'} 秒</p><ul class="issues">${(r.issues??[]).map(i=>`<li><b>${esc(i.id??'未建模内容')}</b> [${esc(i.category)}] ${esc(i.reason)}</li>`).join('')}</ul><details><summary>模型记录的优点</summary><ul>${(r.strengths??[]).map(s=>'<li>'+esc(s)+'</li>').join('')}</ul></details><p class="muted">图框按JSON原始bbox显示；旋转字段另列，不把bbox当精确分割轮廓。归属关系不代表提取或多窗口清理已经成功。</p>`;
 document.querySelectorAll('.panel [data-id]').forEach(el=>el.addEventListener('click',()=>{const side=el.closest('.panel').dataset.side;selected[side]=el.dataset.id;const y=window.scrollY;render();window.scrollTo(0,y)}));
}
function change(i){current=(i+data.cases.length)%data.cases.length;selected={old:null,new:null};render()}
$('cases').onchange=()=>change(Number($('cases').value));$('prev').onclick=()=>change(current-1);$('next').onclick=()=>change(current+1);for(const id of ['kind','labels','only'])$(id).onchange=render;$('clear').onclick=()=>{selected={old:null,new:null};render()};
$('table').innerHTML='<table><thead><tr><th>参考图</th><th>总对象 旧→新</th><th>照片 旧→新</th><th>装饰 旧→新</th></tr></thead><tbody>'+data.cases.map((c,i)=>`<tr data-index="${i}"><td>${esc(c.name)}</td><td>${c.old?.objects??'—'} → ${c.new?.objects??'—'}</td><td>${c.old?.counts.photo??0} → ${c.new?.counts.photo??'—'}</td><td>${c.old?.counts.overlay??0} → ${c.new?.counts.overlay??'—'}</td></tr>`).join('')+'</tbody></table>';
document.querySelectorAll('[data-index]').forEach(el=>el.onclick=()=>{change(Number(el.dataset.index));window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
