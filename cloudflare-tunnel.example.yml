# Configure an Access application and its exact-email Allow policy BEFORE routing DNS.
# Replace the example hostname, team name, audience and tunnel credentials.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: REPLACE_WITH_PRIVATE_CREDENTIALS_JSON_PATH
protocol: http2
metrics: 127.0.0.1:20242
ingress:
  - hostname: workbench.example.com
    service: http://127.0.0.1:8796
    originRequest:
      access:
        required: true
        teamName: REPLACE_WITH_ACCESS_TEAM_NAME
        audTag:
          - REPLACE_WITH_ACCESS_APPLICATION_AUD
  - service: http_status:404
